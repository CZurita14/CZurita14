<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-label="Pipeline: sensor, datos, modelo, API, agente">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
    .t { fill: #e6edf3; font-size: 12px; font-weight: 700; }
    .s { fill: #7d8590; font-size: 10px; }
    .flow { stroke-dasharray: 6 8; animation: flow 1s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -28; } }
    .card { animation: lit 5s ease-in-out infinite; }
    @keyframes lit { 0%,100% { stroke-opacity: .35; } 10%,25% { stroke-opacity: 1; } }
    .float { animation: float 3s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-4px); } }
  </style>

  <rect x="1" y="1" width="898" height="228" rx="14" fill="#0b0f17" stroke="#1b2333"/>
  <text x="24" y="30" fill="#a78bfa" font-size="11" font-weight="700" letter-spacing="2">FROM DATA TO DEPLOY</text>
  <text x="876" y="30" text-anchor="end" class="s">idea → producción</text>

  <path d="M110 125H790" stroke="#1b2333" stroke-width="6" stroke-linecap="round"/>
  <path d="M110 125H790" stroke="url(#line)" stroke-width="2" class="flow"/>


  <!-- stages -->
  <g class="float">
    <rect class="card" x="40" y="80" width="140" height="90" rx="12" fill="#0f1522" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="110" y="113" text-anchor="middle" font-size="24">📡</text>
    <text x="110" y="140" text-anchor="middle" class="t">SENSE</text>
    <text x="110" y="157" text-anchor="middle" class="s">ESP32 · IoT</text>
  </g>
  <g class="float" style="animation-delay:.4s">
    <rect class="card" style="animation-delay:1s" x="210" y="80" width="140" height="90" rx="12" fill="#0f1522" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="280" y="113" text-anchor="middle" font-size="24">🧹</text>
    <text x="280" y="140" text-anchor="middle" class="t">CLEAN</text>
    <text x="280" y="157" text-anchor="middle" class="s">pandas · ETL</text>
  </g>
  <g class="float" style="animation-delay:.8s">
    <rect class="card" style="animation-delay:2s" x="380" y="80" width="140" height="90" rx="12" fill="#0f1522" stroke="#34d399" stroke-width="1.5"/>
    <text x="450" y="113" text-anchor="middle" font-size="24">🧠</text>
    <text x="450" y="140" text-anchor="middle" class="t">TRAIN</text>
    <text x="450" y="157" text-anchor="middle" class="s">sklearn · XGBoost</text>
  </g>
  <g class="float" style="animation-delay:1.2s">
    <rect class="card" style="animation-delay:3s" x="550" y="80" width="140" height="90" rx="12" fill="#0f1522" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="620" y="113" text-anchor="middle" font-size="24">⚡</text>
    <text x="620" y="140" text-anchor="middle" class="t">SERVE</text>
    <text x="620" y="157" text-anchor="middle" class="s">FastAPI · Docker</text>
  </g>
  <g class="float" style="animation-delay:1.6s">
    <rect class="card" style="animation-delay:4s" x="720" y="80" width="140" height="90" rx="12" fill="#0f1522" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="790" y="113" text-anchor="middle" font-size="24">🤖</text>
    <text x="790" y="140" text-anchor="middle" class="t">AGENT</text>
    <text x="790" y="157" text-anchor="middle" class="s">LLM · PumaNet</text>
  </g>

  <g filter="url(#glow)">
    <circle r="5" fill="#22d3ee"><animateMotion dur="5s" repeatCount="indefinite" path="M90 125H810"/></circle>
    <circle r="4" fill="#fbbf24"><animateMotion dur="5s" begin="1.7s" repeatCount="indefinite" path="M90 125H810"/></circle>
    <circle r="4" fill="#f472b6"><animateMotion dur="5s" begin="3.3s" repeatCount="indefinite" path="M90 125H810"/></circle>
  </g>

  <text x="450" y="206" text-anchor="middle" class="s">$ <tspan fill="#e6edf3">deploy --from notebook --to production</tspan> <tspan fill="#34d399">✓ ok</tspan></text>
</svg>
